plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// ModLauncher 10.2.3 requires the automatic Java module name "jopt.simple".
// jopt-simple 6.x renamed it to "joptsimple", so keep Forge on Minecraft's 5.0.4.
configurations.configureEach {
    resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4'
}
repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://cursemaven.com' }
    mavenCentral()
}
dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"

    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-common-api:$rootProject.jei_version"
    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-forge-api:$rootProject.jei_version"
    modRuntimeOnly "mezz.jei:jei-$rootProject.minecraft_version-forge:$rootProject.jei_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modCompileOnly "top.theillusivec4.curios:curios-forge:$rootProject.curios_version:api"
    if (rootProject.hasProperty('withAccessories')) {
        modRuntimeOnly "top.theillusivec4.curios:curios-forge:$rootProject.curios_version"
    }
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    def props = [
        minecraft_version: rootProject.minecraft_version,
        minecraft_version_range: '[1.20.1,1.20.2)',
        forge_version: rootProject.forge_version,
        forge_version_range: '[47.4,48)',
        loader_version_range: '[47,)',
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_license: rootProject.mod_license,
        mod_version: rootProject.mod_version,
        mod_authors: rootProject.mod_authors,
        mod_description: rootProject.mod_description,
        displayURL: rootProject.display_url
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
